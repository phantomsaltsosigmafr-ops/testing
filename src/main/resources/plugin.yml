name: UnstableSMP
version: '${version}'
main: dev.unstablesmp.UnstableSMP
api-version: '1.21'
description: Unstable SMP Simulator - Vexbot swarms, ability sets, faction armies, battles and server events.
authors: [UnstableSMP]
softdepend: [WorldGuard]
# The /uss command is registered at runtime through Paper's command API (no commands: block needed).
# /vexbot and /vex are deliberately never registered so the separate VexBot plugin keeps them.

permissions:
  uss.admin:
    description: Everything in UnstableSMP.
    default: op
    children:
      uss.gui: true
      uss.give: true
      uss.formation: true
      uss.event: true
      uss.battle: true
      uss.reload: true
      uss.status: true
      uss.ability.*: true
      uss.bot: true
      uss.duel: true
      uss.kit: true
      uss.team: true
      uss.map: true
      uss.lobby: true
      uss.game: true
      uss.cine: true
      uss.pack: true
  uss.gui:
    description: Open /uss gui and use Faction Horns.
    default: op
  uss.give:
    description: /uss give and the GUI ability page.
    default: op
  uss.formation:
    description: /uss formation for your own swarm.
    default: true
  uss.event:
    description: Start and stop server events (/uss event, GUI).
    default: op
  uss.battle:
    description: Start and end faction battles (/uss battle, GUI).
    default: op
  uss.reload:
    description: /uss reload
    default: op
  uss.status:
    description: /uss status (entity counts and tick timings).
    default: op
  uss.bot:
    description: Spawn, clear and command player bots (/uss bot, GUI bot page).
    default: op
  uss.duel:
    description: /uss duel - fight a bot 1v1.
    default: true
  uss.kit:
    description: /uss kit give/save/delete/list.
    default: op
  uss.team:
    description: /uss team join/leave/gui for any players (everyone can use the team menu from the GUI).
    default: op
  uss.map:
    description: Create maps, set spawns and link lobby blocks (/uss map).
    default: op
  uss.lobby:
    description: /uss lobby - back to the lobby.
    default: true
  uss.game:
    description: Start and stop simulator games (/uss game).
    default: op
  uss.cine:
    description: Cinematic tools - /uss cam, scene, fake, fx.
    default: op
  uss.pack:
    description: /uss pack send/reload.
    default: op
  uss.combat.bypass:
    description: Never combat-tagged.
    default: false
  uss.ability.*:
    description: Use every ability set.
    default: true
    children:
      uss.ability.vexbots: true
      uss.ability.null: true
      uss.ability.portal: true
      uss.ability.law: true
      uss.ability.cindercrest: true
  uss.ability.vexbots:
    description: Use VEXBOTS ability items.
    default: true
  uss.ability.null:
    description: Use NULL ability items.
    default: true
  uss.ability.portal:
    description: Use PORTAL SWARM ability items.
    default: true
  uss.ability.law:
    description: Use LAW ability items.
    default: true
  uss.ability.cindercrest:
    description: Use CINDERCREST ability items.
    default: true
