name: UnstableSMP
version: '${version}'
main: dev.unstablesmp.UnstableSMP
api-version: '1.21'
description: NULL portal breach - portals tear open and VexBot bots pour out of them.
authors: [UnstableSMP]
# Only /uss is registered. /vexbot belongs to the VexBot plugin; this plugin just runs it.
commands:
  uss:
    description: NULL portal breach (start, portal, stop, spot, status, reload).
    usage: /uss help
    permission: uss.admin
permissions:
  uss.admin:
    description: Use /uss.
    default: op
