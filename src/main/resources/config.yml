# -----------------------------------------------------------------------------------------------------
#  Combos: damage from one of "sources" against a target carrying "mark" is multiplied.
#  Marks: NULL_BRAND, SENTENCED, SILENCED, IN_NULL_FIELD, BURNING.
#  Sources: ability ids, plus swarm keys swarm / vortex / cage / pincer / rain / dive_strike /
#           arrowhead_dive / portal_swarm.
# -----------------------------------------------------------------------------------------------------
combos:
  max-total-multiplier: 2.5
  chat-announce: false
  list:
    branded-dive:
      mark: NULL_BRAND
      sources: [arrowhead_dive, dive_strike, rain]
      multiplier: 1.6
      message: "<dark_purple><bold>BRANDED DIVE!</bold> <gray>x1.6"
    branded-swarm:
      mark: NULL_BRAND
      sources: [swarm, vortex, cage, pincer, portal_swarm]
      multiplier: 1.3
      message: "<dark_purple>Brand resonates <gray>x1.3"
    final-judgment:
      mark: SENTENCED
      sources: [judgment]
      multiplier: 1.75
      message: "<gold><bold>FINAL JUDGMENT!</bold> <gray>x1.75"
    void-meteor:
      mark: IN_NULL_FIELD
      sources: [ashfall, rain]
      multiplier: 1.3
      message: "<white>VOID <dark_gray>IMPACT <gray>x1.3"
    kindling:
      mark: BURNING
      sources: [ashfall, phoenix_burst]
      multiplier: 1.2
      message: "<gold>Kindling <gray>x1.2"
    chained-swarm:
      mark: SENTENCED
      sources: [vortex, cage, pincer]
      multiplier: 1.25
      message: "<gold>Nowhere to run <gray>x1.25"

# -----------------------------------------------------------------------------------------------------
#  Combat tag
# -----------------------------------------------------------------------------------------------------
combat-tag:
  enabled: true
  duration-seconds: 15
  tag-on-pve: false                 # also tag when fighting mobs/units
  kill-on-logout: true              # logging out while tagged kills you
  block-ender-pearls: true
  blocked-teleport-causes: [COMMAND]
  blocked-commands: [spawn, home, homes, sethome, tpa, tpahere, tpaccept, tpyes, warp, warps, back, rtp, wild, tp, tpo, hub, lobby, ec, enderchest]

# -----------------------------------------------------------------------------------------------------
#  Kill messages: "<victim> was <VERB> by <killer>" (format in messages.yml -> kill.format)
#  Lookup order: verbs.<ability or swarm key>  ->  factions.<id>.kill-verbs  ->  verbs.<ability set>  ->  default
# -----------------------------------------------------------------------------------------------------
kill-messages:
  enabled: true
  window-seconds: 10
  style-vanilla-pvp: true
  default: [SMASHED, WRECKED, DELETED, FOLDED]
  pvp: [SMASHED, CLAPPED, BONKED, WRECKED, DESTROYED, DIFFED]
  verbs:
    swarm: [SWARMED, SHREDDED, DISASSEMBLED]
    vortex: [SPUN OUT, SHREDDED, BLENDED]
    cage: [CAGED, CRUSHED]
    pincer: [PINCERED, FLANKED]
    rain: [SKEWERED, PINNED]
    dive_strike: [DIVEBOMBED, SKEWERED]
    arrowhead_dive: [OBLITERATED, SPEARED, DIVEBOMBED]
    portal_swarm: [CONSUMED, OVERRUN]
    null_field: [NULLIFIED, VOIDED]
    judgment: [JUDGED, GAVELED, SENTENCED TO DEATH]
    ember_crest: [TORCHED, SCORCHED]
    ashfall: [METEORED, INCINERATED, CRATERED]
    phoenix_burst: [REBORN ON, SUPERNOVA'D]
    combat_log: [EXECUTED FOR COMBAT LOGGING]
    vexbots: [SWARMED]
    null: [ERASED]
    portal: [OVERRUN]
    law: [ARRESTED]
    cindercrest: [BURNED]

# -----------------------------------------------------------------------------------------------------
#  Faction units (real mobs with Paper pathfinding)
# -----------------------------------------------------------------------------------------------------
units:
  aggro-range: 24
  defend-range: 14
  teleport-stragglers: true
  max-per-faction: 120
  max-total: 300
  attack-monsters: true            # non-event factions also fight hostile mobs
  grudge-seconds: 30               # players who hit a faction's units become targets for this long
  call-for-help: {range: 14, max-helpers: 6}
  crit-multiplier: 1.5
  lifesteal-fraction: 0.3
  rage-threshold: 0.4
  retreat-threshold: 0.3
  leader-bossbar-range: 48
  flyers:                          # flying units (vexes) are fully plugin-driven
    dive-speed: 0.6
    attack-cooldown-ticks: 20
  building:
    max-break-hardness: 6.0        # obsidian is 50, stone 1.5, deepslate 3
    drop-broken-blocks: false
    max-tracked-placed: 6000
    never-break: [CHEST, BARREL, SHULKER_BOX, FURNACE, SMOKER, HOPPER, DISPENSER, DROPPER, BED, SIGN, SPAWNER, BEDROCK,
                  END_PORTAL, END_GATEWAY, BEACON, ENDER_CHEST, LECTERN, JUKEBOX, BREWING_STAND, CRAFTER, DECORATED_POT,
                  BOOKSHELF, SHELF, BARRIER, COMMAND_BLOCK, STRUCTURE, JIGSAW, REINFORCED_DEEPSLATE, VAULT, RESPAWN_ANCHOR,
                  LODESTONE, CONDUIT, BANNER, HEAD, SKULL, ANVIL, ENCHANTING_TABLE, NETHER_PORTAL, OBSIDIAN, CHISELED]

factions-settings:
  focus-glow-ticks: 60

