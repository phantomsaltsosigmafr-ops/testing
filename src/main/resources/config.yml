# UnstableSMP - NULL portal breach
# Portals tear open around a point and VexBot's bots pour out of them. Each open portal runs the spawn command
# at its mouth over and over, faster and bigger as the breach goes on.
# /uss reload applies changes (a breach that's already running keeps the settings it started with).

spawn:
  # Run once per pulse, per portal, by the console. Placeholders:
  #   {x} {y} {z} block coords of the portal mouth   {xd} {yd} {zd} same with one decimal
  #   {count} bots this pulse   {world}   {portal} (1, 2, ...)   {breach}   {facing} (north/...)   {yaw}
  # Add more lines to run more commands per pulse (e.g. a sound or a title from another plugin).
  commands:
    - "vexbot nullportalspawn {x} {y} {z} {count}"
  run-as: CONSOLE            # CONSOLE, or STARTER (the player who ran /uss start, if online)
  depth: 0                   # 0 = spawn inside the void so they walk out of it; 1+ = that many blocks in front
  spread: true               # spawn at random columns across the opening instead of always the middle
  count-start: 1-2           # bots per pulse when a portal first opens...
  count-end: 2-3             # ...growing to this by the end of the breach
  interval-ticks: [60, 24]   # ticks between pulses per portal: at the start, at the end (20 ticks = 1 second)
  max-alive: 60              # pause pouring while this many poured bots are alive, resume as they die (0 = off)
  max-total: 300             # never pour more than this in one breach (0 = no limit)
  first-pulse-delay-ticks: 12
  push-spawned: true         # anything the command spawns at the mouth gets shoved out of the portal
  push-speed: 0.55
  push-up: 0.25
  capture-ticks: 3           # how long after each command to watch for spawned bots to shove

breach:
  # Console commands when the portals tear open / when the breach is over. Placeholders: {x} {y} {z} {world}
  # {portals} {breach}. E.g. clear VexBot's bots after a recording: end-commands: ["vexbot <its clear command>"]
  start-commands: []
  end-commands: []
  portals: 4
  radius: 14-26              # portals open this far from the centre, spread evenly around it, facing inward
  min-spacing: 9
  duration-seconds: 90       # how long portals stay open
  warning-seconds: 6         # rumble + countdown before the first portal tears open (0 = none)
  open-stagger-ticks: 22     # portals rip open one after another
  close-stagger-ticks: 10
  storm: true                # thunderstorm while a breach runs, previous weather restored after
  darkness: true             # Darkness pulse on players near a portal when it tears open
  darkness-radius: 28
  broadcast-radius: 128      # who sees the titles and boss bar (0 = whole world)
  bossbar-color: PURPLE      # PINK BLUE RED GREEN YELLOW PURPLE WHITE
  bossbar-style: NOTCHED_20  # PROGRESS NOTCHED_6 NOTCHED_10 NOTCHED_12 NOTCHED_20

portal:
  width: 3                   # size of the opening (the frame goes around it)
  height: 5
  frame: [OBSIDIAN, OBSIDIAN, OBSIDIAN, CRYING_OBSIDIAN, BLACKSTONE]
  corners: CRYING_OBSIDIAN
  surface: END_GATEWAY       # the void: a black starfield that glows and never teleports anyone
  opening-beam: CENTER       # END_GATEWAY beam into the sky as it opens: NONE, CENTER or ALL
  lightning: true            # lightning strike (visual only) as each portal tears open
  build-ticks: 30            # how long the frame takes to rise
  corruption:                # the ground in front turns to null-stuff and heals when the portal closes
    enabled: true
    radius: 6
    max-blocks: 70
    blocks: ["BLACK_CONCRETE:4", "BLACKSTONE:3", "SCULK:3", "CRYING_OBSIDIAN:1", "POLISHED_BLACKSTONE:1"]
  # Portals never go on these (or on chests, signs, any block entity, or another portal). Everything else they
  # replace is put back exactly when the portal closes, even after a crash or kill (restore.log).
  never-replace: [BEDROCK, BARRIER, END_PORTAL_FRAME, END_PORTAL, NETHER_PORTAL, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK,
                  REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, SPAWNER, REINFORCED_DEEPSLATE, NOTE_BLOCK,
                  LIGHT, STRUCTURE_VOID]

# Particles: "NAME count across up out speed [extra]" (offsets are in portal space: across the portal, up, out of it).
#   extra = colour (#000000) for DUST, or a block / "ground" for BLOCK.
# Sounds: "key volume pitch" (pitch can be a range like 0.5-0.8).
effects:
  warning-start:
    particles: ["SCULK_SOUL 60 8 1 8 0.02"]
    sounds: ["minecraft:entity.elder_guardian.curse 3 0.5", "minecraft:ambient.cave 4 0.6"]
  warning-pulse:
    sounds: ["minecraft:entity.warden.heartbeat 5 0.5"]
  warning-ground:
    particles: ["BLOCK 28 1.6 0.05 1.0 0.15 ground", "SCULK_CHARGE_POP 6 1.4 0.1 1.0 0.02", "SMOKE 8 1.2 0.1 0.8 0.01"]
    sounds: ["minecraft:block.deepslate.break 1.5 0.5-0.7"]
  tear:
    particles: ["EXPLOSION_EMITTER 1", "SONIC_BOOM 1", "REVERSE_PORTAL 260 1.2 2.4 0.4 1.2",
                "SQUID_INK 90 1.0 2.0 1.0 0.25", "LARGE_SMOKE 60 1.2 2.2 1.2 0.05"]
    sounds: ["minecraft:block.end_portal.spawn 5 0.6", "minecraft:entity.warden.sonic_boom 3 0.6",
             "minecraft:entity.wither.spawn 2 1.3"]
  tear-ground:
    particles: ["BLOCK 120 2.5 0.1 2.5 0.3 ground", "DUST 60 2 0.2 2 0 #000000", "SCULK_SOUL 30 2 0.2 2 0.05"]
  frame-block:
    particles: ["BLOCK 14 0.3 0.3 0.3 0.1 CRYING_OBSIDIAN", "REVERSE_PORTAL 8 0.3 0.3 0.3 0.05", "DUST 6 0.35 0.35 0.35 0 #1A0A2E"]
    sounds: ["minecraft:block.respawn_anchor.charge 1.4 0.5-0.8"]
  surface-row:
    particles: ["REVERSE_PORTAL 40 1.5 0.4 0.3 0.3", "SQUID_INK 10 1.4 0.3 0.2 0.05"]
    sounds: ["minecraft:block.end_portal_frame.fill 1.6 0.5-0.7"]
  open:
    particles: ["REVERSE_PORTAL 200 1.2 2.5 0.3 1.5", "END_ROD 40 1 2 0.5 0.15", "WITCH 30 1.2 2.2 0.6 0.1"]
    sounds: ["minecraft:entity.ender_dragon.growl 3 0.6", "minecraft:block.beacon.activate 3 0.5"]
  ambient:
    particles: ["REVERSE_PORTAL 6 1.3 2.0 0.15 0.02", "SQUID_INK 2 1.2 2.0 0.4 0.03", "SMOKE 3 1.4 2.2 0.6 0.02",
                "ASH 6 2 2.5 1.5 0"]
  ambient-hum:
    particles: ["SCULK_SOUL 6 1.2 2 0.4 0.03"]
    sounds: ["minecraft:block.portal.ambient 1.8 0.5", "minecraft:block.beacon.ambient 2 0.5"]
  corrupt:
    particles: ["SCULK_CHARGE_POP 3 0.3 0.05 0.3 0.01", "SQUID_INK 2 0.3 0.05 0.3 0.02"]
    sounds: ["minecraft:block.sculk.spread 0.7 0.6-0.9"]
  pulse:                     # at the spawn point, every time bots pour out
    particles: ["REVERSE_PORTAL 70 0.4 0.9 0.4 0.6", "SQUID_INK 25 0.4 0.8 0.4 0.12", "LARGE_SMOKE 15 0.4 0.8 0.4 0.03",
                "SCULK_SOUL 8 0.3 0.6 0.3 0.05"]
    sounds: ["minecraft:entity.enderman.teleport 1.6 0.5-0.7", "minecraft:block.respawn_anchor.deplete 1.4 0.5-0.6"]
  pulse-surface:             # the void ripples on each pulse
    particles: ["SQUID_INK 20 1.2 2.0 0.2 0.15", "REVERSE_PORTAL 30 1.2 2.0 0.1 0.4"]
  surface-collapse:
    particles: ["REVERSE_PORTAL 60 1.3 0.4 0.3 0.8", "LARGE_SMOKE 20 1.3 0.4 0.4 0.03"]
    sounds: ["minecraft:block.respawn_anchor.deplete 1.6 0.4-0.6"]
  frame-crumble:
    particles: ["BLOCK 30 0.6 0.6 0.6 0.2 OBSIDIAN", "LARGE_SMOKE 6 0.5 0.5 0.5 0.03"]
    sounds: ["minecraft:block.deepslate_bricks.break 1.4 0.5-0.7"]
  sealed:
    particles: ["EXPLOSION 6 1 2 1 0", "SQUID_INK 40 1 2 1 0.2"]
    sounds: ["minecraft:block.beacon.deactivate 3 0.5", "minecraft:block.conduit.deactivate 2 0.6"]

