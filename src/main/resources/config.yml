# UnstableSMP - NULL portal invasion
# Dozens of floating nether portals tear open in waves over an area and VexBot's bots pour out of them, then the
# portals collapse. No boss bar, no titles, no chat: players only see and hear it happen.
# /uss reload applies changes (an invasion that's already running keeps the settings it started with).

spawn:
  # Run by the console at a portal each time bots come through it. Placeholders:
  #   {x} {y} {z} block inside the bottom of the portal   {xd} {yd} {zd} same with one decimal
  #   {count} bots this time   {world}   {portal} (1, 2, ...)   {invasion}   {facing} side they come out   {yaw}
  # Add more lines to run more commands each time.
  commands:
    - "vexbot nullportalspawn {x} {y} {z} {count}"
  run-as: CONSOLE            # CONSOLE, or STARTER (the player who ran /uss start, if online)
  count: 1                   # bots per portal each time (a range like 1-2 works)
  interval-ticks: 40         # every 2 seconds each portal gets a chance to pour...
  chance-per-portal: 0.25    # ...this likely (so with 60 portals, ~15 pour every round)
  max-alive: 60              # pause pouring while this many poured bots are alive, resume as they die (0 = off)
  max-total: 400             # never pour more than this in one invasion (0 = no limit)
  # Which bots came out of a portal (for max-alive and the Totem of Null): anything new - mobs, or VexBot's fake
  # players joining - that shows up within capture-radius blocks of a portal in the capture-seconds after it poured.
  capture-radius: 16
  capture-seconds: 10

invasion:
  radius: 40                 # portals open anywhere within this many blocks of the centre
  max-portals: 60
  portals-per-wave: 3        # 3 portals every 10 ticks: the sky fills up in about 10 seconds
  wave-interval-ticks: 10
  min-height-above-ground: 2
  max-height-above-ground: 18
  min-spacing: 4
  close-per-step: 2          # at the end, this many portals collapse every 2 ticks
  duration-seconds: 120
  storm: false               # thunderstorm during the invasion (previous weather restored after)
  keep-chunks-loaded: true   # keep the area loaded so it runs even if nobody is close (command blocks)
  # Console commands when the invasion starts / when the last portal is gone. Placeholders: {x} {y} {z} {world}
  # {portals} {invasion}. E.g. clear VexBot's bots after a recording: end-commands: ["vexbot <its clear command>"]
  start-commands: []
  end-commands: []
  leader:                    # once, part-way through, the leader comes through a random portal
    at-percent: 40
    commands: []             # e.g. ["vexbot nullportalspawn {x} {y} {z} 1"] or a VexBot leader command

# The Totem of Null (/uss totem [player] [amount]). Works like a normal totem and saves you, but when it pops a
# wave rolls out from you and every NULL the invasions poured out dies, nearest first.
totem:
  # Looks exactly like a hand-made one: aqua "The Totem Of Null" (italic, like any renamed item) with Curse of Vanishing.
  name: "<aqua>The Totem Of Null"
  lore: []
  enchantments: ["vanishing_curse:1"]
  # glint: true              # uncomment to force the shimmer on/off (default: vanilla - on, because it's enchanted)
  match-by-name: true        # any totem with this name + these enchantments counts (e.g. one made with /give)
  item-model: ""             # e.g. "unstablesmp:totem_of_null" to use a resource-pack model (Paper 1.21.4+)
  kill-radius: 0             # 0 = every NULL everywhere; otherwise only within this many blocks of the holder
  wave-blocks-per-tick: 2.5  # how fast the death wave rolls outward
  quiet-seconds: 10          # after the wave the portals stop pouring for this long, then the NULL come back
  close-portals: false       # true = the invasion in that world collapses instead
  # Console commands run when it pops (for bots this plugin didn't see spawn, e.g. VexBot's own kill command).
  # Placeholders: {x} {y} {z} {world} {player}
  kill-commands: []

portal:
  build: true                # build the floating obsidian portals (false = only call VexBot at the spots)
  self-repair: true          # put back any portal block that gets removed (VexBot's own null portal clears blocks)
  width: 2                   # size of the opening (the obsidian frame goes around it): 2x3 = classic 4x5 portal
  height: 3
  frame: ["OBSIDIAN"]        # weighted, e.g. ["OBSIDIAN:4", "CRYING_OBSIDIAN:1"]

# Particles: "NAME count across up out speed [extra]" (offsets are in portal space: along it, up, out of it).
#   extra = colour (#000000) for DUST, or a block / "ground" for BLOCK.
# Sounds: "key volume pitch" (pitch can be a range like 0.6-1.2).
effects:
  start:                     # at the centre when the invasion begins
    sounds: ["minecraft:block.end_portal.spawn 3 0.5", "minecraft:ambient.cave 3 0.6"]
  portal-open:
    particles: ["REVERSE_PORTAL 80 0.6 1.2 0.6 0.2", "LARGE_SMOKE 20 0.6 1.2 0.6 0.02"]
    sounds: ["minecraft:block.portal.trigger 0.6 0.6-1.2", "minecraft:block.glass.break 1.2 0.5"]
  spawn:                     # each time bots come through a portal
    particles: ["SQUID_INK 20 0.3 0.8 0.3 0.05", "REVERSE_PORTAL 40 0.3 1.0 0.3 0.3"]
    sounds: ["minecraft:entity.enderman.teleport 1 0.5"]
  ambient:                   # every portal, every 4 ticks
    particles: ["PORTAL 6 0.5 1.0 0.5 0.5"]
  ambient-sound:             # a random portal every 2 seconds
    sounds: ["minecraft:block.portal.ambient 0.8 0.5-1.0"]
  leader:
    particles: ["REVERSE_PORTAL 200 1 2 1 0.5", "SQUID_INK 60 1 2 1 0.1"]
    sounds: ["minecraft:entity.enderman.teleport 2 0.4"]
  closing:                   # at the centre when the portals start collapsing
    sounds: ["minecraft:entity.elder_guardian.curse 2 0.5"]
  portal-close:
    particles: ["LARGE_SMOKE 25 0.5 1.2 0.5 0.03", "SQUID_INK 15 0.5 1.2 0.5 0.05"]
    sounds: ["minecraft:block.glass.break 1 0.6"]
  totem-pop:                 # at whoever's Totem of Null popped (the normal totem animation plays too)
    particles: ["SONIC_BOOM 1", "TOTEM_OF_UNDYING 160 1 1.5 1 0.9", "REVERSE_PORTAL 220 2.5 1.5 2.5 1.6",
                "SQUID_INK 70 1.5 1.2 1.5 0.35"]
    sounds: ["minecraft:entity.warden.sonic_boom 3 0.6", "minecraft:block.end_portal.spawn 2 1.4"]
  totem-kill:                # on each NULL as the wave reaches it
    particles: ["SQUID_INK 25 0.3 0.8 0.3 0.08", "REVERSE_PORTAL 30 0.3 0.8 0.3 0.4", "LARGE_SMOKE 10 0.3 0.6 0.3 0.02"]
    sounds: ["minecraft:entity.enderman.teleport 0.8 0.5"]

# Replies to whoever runs /uss (MiniMessage). Players in the world never get chat from this plugin.
messages:
  prefix: "<dark_gray>[<dark_purple>NULL</dark_purple>]</dark_gray> <gray>"
  help: |-
    <dark_purple><bold>NULL portal invasion</bold></dark_purple> <dark_gray>- portals tear open and VexBot bots pour out
    <white>/uss start</white> <gray>[here | at x y z [world] | player] [options]</gray> <dark_gray>- the whole invasion in one command
    <dark_gray>   options: radius=40 portals=60 wave=3 duration=120 chance=0.25 interval=40 count=1 alive=60 max=400
    <white>/uss stop</white> <gray>[now]</gray> <dark_gray>- portals collapse (now = vanish instantly)
    <white>/uss totem</white> <gray>[player] [amount]</gray> <dark_gray>- Totem of Null: when it pops, every NULL dies
    <white>/uss status</white> <dark_gray>| <white>/uss reload
  started: "Invasion at <white><x> <y> <z></white> (<world>): up to <white><portals></white> portals within <white><radius></white> blocks for <white><seconds>s</white>."
  stopped: "Collapsing <white><count></white> invasion(s)."
  stopped-now: "Closed <white><count></white> invasion(s) instantly; every block is back."
  nothing-running: "No invasion is running."
  status-line: "#<id> <white><phase></white> in <world> at <x> <z>: <white><portals></white> portals, <white><spawned></white> bots poured, <white><alive></white> alive"
  reloaded: "Config reloaded. A running invasion keeps its settings."
  missing-command: "<red>The spawn command <white><command></white> isn't installed, so portals open but nothing pours out. Install VexBot or change spawn.commands in config.yml."
  bad-option: "<red>Didn't understand <white><option></white>."
  unknown-world: "<red>No world called <white><world></white>."
  unknown-player: "<red>No online player called <white><player></white>."
  totem-given: "Gave <white><player></white> <white><count></white>x Totem of Null."
