# =====================================================================================================
#  UnstableSMP - Unstable SMP Simulator
#  Every number lives here. Text lives in messages.yml (MiniMessage).  /uss reload applies changes.
#  Times: "-seconds" keys are seconds, "-ticks" keys are server ticks (20 ticks = 1 second).
# =====================================================================================================

# -----------------------------------------------------------------------------------------------------
#  Performance caps (the plugin never spawns past these)
# -----------------------------------------------------------------------------------------------------
performance:
  max-display-entities-per-player: 160   # displays + hitboxes owned by one player (swarm, portals, effects)
  max-display-entities-server: 2000      # all display/interaction entities from this plugin
  max-mobs-server: 400                   # all faction units (armies, events, battles)
  max-effects: 300                       # active ability effects (zones, gavels, meteors, portals...)
  actionbar-interval-ticks: 5            # how often the combined action bar refreshes

# -----------------------------------------------------------------------------------------------------
#  VEXBOTS swarm (display entities only - no real mobs)
# -----------------------------------------------------------------------------------------------------
swarm:
  size: 24                     # bots per summon
  shard-ratio: 0.35            # fraction of bots that are blade shards instead of cubes
  lifetime-seconds: 90         # a swarm fades after this (0 = until recalled/dismissed); re-summon refreshes it
  leash-range: 48              # targets further than this from the owner are dropped
  target-memory-seconds: 20    # forget a target nobody has touched for this long
  dive-strike-count: 8         # bots sent by Dive Strike (right-click)
  portal-linger-seconds: 5     # how long a portal's bots stay after the portal closes
  bot:
    cube-hp: 6
    shard-hp: 3
    cube-scale: 0.5
    shard-scale: 0.9
    body-block: OBSIDIAN
    face-block: PURPLE_CONCRETE        # rendered full-bright: the glowing "eye/face" panel
    shard-item: NETHERITE_SWORD
    glow: true
    glow-color: "#A020F0"
    hitboxes: true                     # Interaction hitboxes so players can hit bots (raytrace fallback is always on)
    view-range: 1.0                    # display view-range multiplier
  movement:
    update-interval-ticks: 2           # position packets every N ticks (client interpolates in between)
    max-speed: 0.8
    max-force: 0.14
    dive-speed: 1.5
    slot-gain: 0.35                    # how hard bots pull toward their formation slot
    separation-radius: 1.0
    separation-weight: 0.9
    alignment-weight: 0.08
    cohesion-weight: 0.02
    neighbour-radius: 3.0
    wander: 0.03
  damage:
    contact: 0.75                      # per bot touching the target (per bot-hit-cooldown)
    dive: 2.0                          # per diving bot that connects
    contact-radius: 1.4
    apply-interval-ticks: 10           # swarm damage is summed and applied once per interval (respects i-frames)
    max-per-hit: 6.0                   # cap per application, before combos
    bot-hit-cooldown-ticks: 12
    harass-interval-ticks: 30          # passive formations send a few bots at the target this often
    harass-count: 2
    projectile-vs-bot: 4.0             # damage an arrow/trident does to a bot it hits
  effects:
    trail-every-ticks: 6               # END_ROD / DRAGON_BREATH / REVERSE_PORTAL trail per bot
    ambient-sound-every-ticks: 70
  formations:
    rotation-speed: 1.0
    breathe: 0.06
    halo: {radius: 1.8, height: 2.7}
    sky-crown: {radius: 9.0, height: 15.0}
    v-wedge: {spacing: 1.1, distance: 3.0}
    phalanx-wall: {spacing: 0.85, distance: 3.0}
    spiral-vortex: {radius: 3.2, height: 4.5}
    dome-cage: {radius: 4.5, assemble-ticks: 16, max-seconds: 6, push: 0.55}
    arrowhead-dive: {height: 9.0, back: 7.0, spacing: 0.9, assemble-ticks: 24, return-ticks: 60}
    pincer: {radius: 5.5}
    rain: {height: 11.0, spacing: 1.15, drop-interval-ticks: 3}
    orbit-shield: {radius: 3.0}

