# Example scene: /uss scene play null_invasion @p
# "at" = ticks after the scene starts (20 ticks = 1 second). Actions: title, actionbar, message, chat, join, leave,
# death, sound, fade, shake, slowmo, camera, spawn, target, clear, tp, kit, team, game, command.
steps:
  - {at: 0, action: fade, mode: out, ticks: 40}
  - {at: 0, action: sound, sound: "minecraft:ambient.cave", volume: 2.0, pitch: 0.5}
  - {at: 40, action: fade, mode: in}
  - {at: 40, action: title, text: "<dark_gray><obf>XXXX</obf> <white><bold>NULL</bold> <dark_gray><obf>XXXX</obf>", sub: "<gray>they are already here", in: 10, stay: 60, out: 20}
  - {at: 60, action: join, name: "<dark_gray><obf>Kq8xZ1mP</obf>"}
  - {at: 70, action: join, name: "<dark_gray><obf>a9V0lQ</obf>"}
  - {at: 80, action: join, name: "<white>____D____"}
  - {at: 100, action: chat, name: "<white>____D____", message: "<gray>found you."}
  - {at: 120, action: spawn, group: "null", count: 12, leaders: true, spread: 6}
  - {at: 125, action: shake, ticks: 30, strength: 2.0}
  - {at: 125, action: sound, sound: "minecraft:entity.wither.spawn", volume: 1.0, pitch: 0.6}
  - {at: 140, action: chat, name: "<white><bold>JamatoP", message: "<white>Clean them up."}
  - {at: 150, action: target, group: "null"}
  - {at: 160, action: slowmo, rate: 6, ticks: 40}
