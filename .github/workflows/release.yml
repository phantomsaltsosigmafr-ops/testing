name: Build and release

# Every push to the default branch builds the plugin, runs the tests and publishes the jar as the
# GitHub release v<version> (replacing the previous build of that version). Other branches just build.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Find the jar
        id: jar
        run: |
          JAR=$(ls build/libs/UnstableSMP-*.jar | grep -vE -- '-(dev|sources|javadoc)' | head -n1)
          VERSION=${JAR#build/libs/UnstableSMP-}
          VERSION=${VERSION%.jar}
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built $JAR (version $VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: UnstableSMP-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}

      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
          VERSION: ${{ steps.jar.outputs.version }}
        run: |
          TAG="v$VERSION"
          SHORT=$(git rev-parse --short HEAD)
          cat > notes.md <<NOTES
          **UnstableSMP $VERSION**: NULL portal breach for **Paper 1.21.x** (Java 21). Built from commit $SHORT.

          Portals tear open around a point and each one runs \`vexbot nullportalspawn x y z <number>\` at its mouth over and over, so VexBot's bots pour out of the void.

          ### Install
          1. Download **UnstableSMP-$VERSION.jar** below.
          2. Put it in your server's \`plugins/\` folder. Delete any older UnstableSMP jar first.
          3. Fully restart the server. VexBot must be installed for bots to pour out.

          ### Try it
          - \`/uss start\`: breach around you (4 portals)
          - \`/uss portal\`: one portal in front of you
          - \`/uss stop\`: collapse everything (\`/uss stop now\` for instant)

          Full commands and config are in the [README](https://github.com/${{ github.repository }}/blob/$GITHUB_SHA/README.md).
          This release is rebuilt on every push, so it's always the newest build.
          NOTES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
            sleep 5
          fi
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "UnstableSMP $VERSION" --notes-file notes.md --latest
