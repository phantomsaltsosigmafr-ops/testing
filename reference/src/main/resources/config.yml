# NullPortals - mass nether portal event
# /nullportal start [radius] [portals] [seconds]   - start around you
# /nullportal at <player> [radius] [portals] [seconds]
# /nullportal stop | list | reload

portals:
  radius: 40                    # how far from the centre portals can open
  max-portals: 60               # total portals per event ("loads")
  portals-per-wave: 3           # portals opened each wave
  wave-interval-ticks: 10       # 20 ticks = 1 second
  min-height-above-ground: 2    # portals float in the air
  max-height-above-ground: 18
  min-spacing: 4                # blocks between portal centres
  duration-seconds: 120         # 0 = run until /nullportal stop
  close-per-step: 2             # portals collapsing every 2 ticks at the end
  allow-teleport: false         # false = walking into them does nothing
  protect-blocks: true          # stop players breaking the portal frames

spawning:
  # VEX     = built-in "null" vexes (fly through walls and hunt players)
  # COMMAND = run the command below for every spawn (use this for VexBot or any other bot plugin)
  mode: VEX
  interval-ticks: 40            # how often each portal rolls for a spawn
  chance-per-portal: 0.25
  max-alive: 40                 # cap on things alive from one event
  despawn-on-end: true          # remove spawned mobs when the portals close (players/bots are never removed)

vex:
  name: "null"
  name-visible: false
  target-range: 64

command:
  # Run for each spawn when spawning.mode is COMMAND. No leading slash needed.
  # Placeholders: {world} {x} {y} {z} {bx} {by} {bz} {n} {target} {starter}
  # Put your VexBot spawn command here, e.g. "vexbot spawn null{n}"  <- check VexBot's real syntax with /vexbot help
  command: ""
  run-as: CONSOLE               # CONSOLE or PLAYER (nearest player to the portal runs it - use if the bot spawns at the sender)
  pull-spawned-to-portal: true  # teleport whatever the command spawned to the portal it came out of
  capture-window-ticks: 5       # also grab mobs the command spawns a few ticks late
